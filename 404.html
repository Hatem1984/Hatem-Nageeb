<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>الصفحة غير موجودة | لعبة البزنس</title>
<style>
*{box-sizing:border-box}
:root{--ink:#07111f;--blue:#2ca7ff;--violet:#6656ff;--muted:#66758b;--line:#dfe7f1}
body{margin:0;min-height:100vh;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(700px 420px at 80% 10%,rgba(44,167,255,.13),transparent 60%),#f5f8fc;color:#10264e;display:grid;place-items:center}
main{width:min(680px,calc(100% - 28px));padding:34px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:38px;box-shadow:0 24px 70px rgba(18,42,82,.11);text-align:center}
.logo{width:76px;height:76px;object-fit:contain;border-radius:50%;margin-bottom:16px}
.code{display:inline-flex;padding:7px 12px;border-radius:999px;background:#eef4ff;color:#3157ca;font-weight:900;font-size:13px}
h1{font-size:34px;line-height:1.35;margin:14px 0 8px;color:var(--ink)}
p{margin:0 auto 24px;max-width:520px;color:var(--muted);line-height:1.85}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;text-decoration:none;font-weight:900}
.primary{color:#fff;background:linear-gradient(90deg,var(--blue),var(--violet));box-shadow:0 12px 28px rgba(76,104,255,.20)}
.secondary{color:#173a73;background:#eef3fa;border:1px solid #dce5ef}
small{display:block;margin-top:18px;color:#8a96a7;line-height:1.7}
@media(max-width:600px){.card{padding:28px 18px}.actions{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<main>
<section class="card">
<img class="logo" src="/assets/شعار_لعبة_البزنس_خفيف.webp" alt="لعبة البزنس">
<span class="code">404</span>
<h1>الصفحة دي مش موجودة</h1>
<p>الرابط ممكن يكون قديم أو اتغير. تقدر ترجع للصفحة الرئيسية أو تبدأ «مختبر قرار مشروعك» مباشرة.</p>
<div class="actions">
<a class="primary" href="/">الصفحة الرئيسية</a>
<a class="secondary" href="/diagnosis/">ابدأ التشخيص المجاني</a>
</div>
<small>لعبة البزنس — التشخيص قبل الحل</small>
</section>
</main>
</body>
</html>
