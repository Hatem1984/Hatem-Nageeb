name: Hide payment display values

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-payment-display.yml'

permissions:
  contents: write

jobs:
  update-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update payment display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Vodafone Cash: keep the copy button/data attribute, but hide the visible value.
          s = re.sub(
              r'(<h4>Vodafone Cash</h4>.*?<div class="payment-data"[^>]*>).*?(</div>)',
              r'\1الرقم مخفي — اضغط الزر لنسخه\2',
              s,
              count=1,
              flags=re.S,
          )

          # InstaPay: remove the visible payment-data value and keep only the direct payment button.
          s = re.sub(
              r'(<h4>InstaPay</h4>.*?<p>.*?</p>)\s*<div class="payment-data">.*?</div>',
              r'\1',
              s,
              count=1,
              flags=re.S,
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide payment account values from view" || true
          git rm .github/workflows/hide-payment-display.yml
          git commit -m "Remove one-time payment display updater"
          git push origin main
