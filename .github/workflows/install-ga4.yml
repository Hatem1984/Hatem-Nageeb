name: Install GA4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GA4 in landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'const GA4_ID = "G-XXXXXXXXXX";'
          new = 'const GA4_ID = "G-C2N57VGT70";'

          if old not in text:
              print('GA4 is already installed; no change needed.')
              raise SystemExit(0)

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('GA4 installed in index.html')
          PY

      - name: Commit tracking update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install GA4 tracking"
          git push
