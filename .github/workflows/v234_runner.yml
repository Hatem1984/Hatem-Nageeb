name: V23.4 runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v234_runner.yml'

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract and run patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/v234_visual_final.yml').read_text(encoding='utf-8')
          start = src.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = src.index("\n          PY", start)
          body = src[start:end]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v234_patch.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/v234_patch.py

      - name: Commit final page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build final premium visual system for V23.4"
          git push

      - name: Clean one-time files
        run: |
          rm -f .github/workflows/v234_visual_final.yml .github/workflows/v234_runner.yml
          git add -A
          git diff --cached --quiet || git commit -m "Remove one-time V23.4 workflow files"
          git push
