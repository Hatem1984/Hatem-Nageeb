name: V23.3 authority logo fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v233_authority_fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch local credential logos when available
        run: |
          curl -L --fail --retry 2 -o ebu_logo.svg "https://www.eb.university/images/logo.svg" || rm -f ebu_logo.svg
          curl -L --fail --retry 2 -o lbs_logo.svg "https://upload.wikimedia.org/wikipedia/commons/b/bc/London_Business_School_logo.svg" || rm -f lbs_logo.svg

      - name: Restore MBA credential and tighten AI wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          mba='''<div class="authority-point credential-point"><div class="credential-logo-wrap ebu-wrap" aria-label="Entrepreneurship & Business University"><img class="credential-logo ebu-mark" src="ebu_logo.svg" alt="Entrepreneurship & Business University (EBU)" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="credential-fallback">EBU</span></div><div class="credential-copy"><b>ماجستير إدارة أعمال (MBA)</b><span>Entrepreneurship & Business University (EBU) — خلفية إدارية تساعد على قراءة المشروع كنظام مترابط.</span></div></div>'''
          lbs_marker='<div class="authority-point credential-point"><div class="credential-logo-wrap lbs-wrap" aria-label="London Business School">'
          if '<b>ماجستير إدارة أعمال (MBA)</b>' not in s and lbs_marker in s:
              s=s.replace(lbs_marker,mba+'\n          '+lbs_marker,1)
          if Path('ebu_logo.svg').exists():
              s=s.replace('src="https://www.eb.university/images/logo.svg"','src="ebu_logo.svg"')
          if Path('lbs_logo.svg').exists():
              s=s.replace('src="https://upload.wikimedia.org/wikipedia/commons/b/bc/London_Business_School_logo.svg"','src="lbs_logo.svg"')
          s=s.replace('<div class="bundle reveal"><div class="bundle-no">09</div><h3>وصول مجاني لأداة AI</h3><p class="micro">6 أشهر مجانًا تبدأ من تاريخ تفعيل حسابك على الأداة.</p></div>', '<div class="bundle reveal"><div class="bundle-no">09</div><h3>أداة التشخيص بالذكاء الاصطناعي</h3><p class="micro">6 أشهر استخدام مجاني للدفعة الأولى، تبدأ من تاريخ تفعيل حسابك على الأداة.</p></div>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit final V23.3 authority fix
        run: |
          git config user.name "Hatem1984"
          git config user.email "88743642+Hatem1984@users.noreply.github.com"
          git add index.html
          [ -f ebu_logo.svg ] && git add ebu_logo.svg || true
          [ -f lbs_logo.svg ] && git add lbs_logo.svg || true
          git commit -m "Fix V23.3 credential logos and authority section"
          git rm .github/workflows/v233_authority_fix.yml
          git commit -m "Remove one-time V23.3 authority workflow"
          git push origin main
