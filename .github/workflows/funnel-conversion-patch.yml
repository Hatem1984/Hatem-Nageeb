name: Funnel conversion patch
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/funnel-conversion-patch.yml
      - tools/funnel_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/funnel_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/funnel-conversion-patch.yml tools/funnel_patch.py
          git add -A
          git commit -m "Improve diagnosis-to-sale funnel and checkout tracking"
          git push
