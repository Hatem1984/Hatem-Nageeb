name: Deploy n8n workflow

on:
  push:
    branches: [main]
    paths:
      - 'automation/n8n/workflows/linkedin-image-generator-v3-cloudflare-staging.json'
  workflow_dispatch:
    inputs:
      workflow_path:
        description: 'Repository path to the n8n workflow JSON'
        required: true
        default: 'automation/n8n/workflows/linkedin-image-generator-v3-cloudflare-staging.json'
      workflow_id:
        description: 'Existing n8n workflow ID. Leave blank only when intentionally creating a new workflow.'
        required: false
        default: 'jwG2V2csZqHzAOTk'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate workflow JSON
        env:
          WORKFLOW_PATH: ${{ github.event_name == 'push' && 'automation/n8n/workflows/linkedin-image-generator-v3-cloudflare-staging.json' || inputs.workflow_path }}
        run: |
          set -euo pipefail
          test -f "$WORKFLOW_PATH"
          jq -e '.name and .nodes and .connections and .settings' "$WORKFLOW_PATH" >/dev/null
          jq -e '.nodes | length > 0' "$WORKFLOW_PATH" >/dev/null

      - name: Build n8n API payload
        env:
          WORKFLOW_PATH: ${{ github.event_name == 'push' && 'automation/n8n/workflows/linkedin-image-generator-v3-cloudflare-staging.json' || inputs.workflow_path }}
        run: |
          jq '{name,nodes,connections,settings}' "$WORKFLOW_PATH" > /tmp/n8n-payload.json

      - name: Preserve existing n8n credentials
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: 'https://vmi3001071.contaboserver.net'
          WORKFLOW_ID: ${{ github.event_name == 'push' && 'jwG2V2csZqHzAOTk' || inputs.workflow_id }}
        run: |
          set -euo pipefail
          test -n "$N8N_API_KEY"

          if [ -z "$WORKFLOW_ID" ]; then
            echo "No existing workflow ID; nothing to preserve."
            exit 0
          fi

          HTTP_CODE=$(curl --silent --show-error             --output /tmp/n8n-current.json             --write-out '%{http_code}'             --request GET             --url "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID"             --header "X-N8N-API-KEY: $N8N_API_KEY")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            jq '{message,code}' /tmp/n8n-current.json || cat /tmp/n8n-current.json
            echo "Could not read current n8n workflow; HTTP $HTTP_CODE"
            exit 1
          fi

          jq --slurpfile current /tmp/n8n-current.json '
            .nodes |= map(
              . as $node
              | if has("credentials") then .
                else
                  (($current[0].nodes
                    | map(select(.id == $node.id or .name == $node.name))
                    | first
                    | .credentials) // null) as $creds
                  | if $creds == null then . else . + {credentials: $creds} end
                end
            )
          ' /tmp/n8n-payload.json > /tmp/n8n-payload-merged.json

          mv /tmp/n8n-payload-merged.json /tmp/n8n-payload.json
          echo "Existing node credentials preserved where the repository JSON does not define them."

      - name: Bind Cloudflare Header Auth credential when available
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: 'https://vmi3001071.contaboserver.net'
        run: |
          set -euo pipefail
          test -n "$N8N_API_KEY"

          HTTP_CODE=$(curl --silent --show-error             --output /tmp/n8n-credentials.json             --write-out '%{http_code}'             --request GET             --url "$N8N_BASE_URL/api/v1/credentials?limit=250"             --header "X-N8N-API-KEY: $N8N_API_KEY")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            CRED_ID=$(jq -r '.data[]? | select(.name == "Header Auth account 48" and .type == "httpHeaderAuth") | .id' /tmp/n8n-credentials.json | head -n1)
            if [ -n "$CRED_ID" ]; then
              jq --arg id "$CRED_ID" '
                .nodes |= map(
                  if .name == "Generate Image - Cloudflare Free"
                  then . + {credentials: {httpHeaderAuth: {id: $id, name: "Header Auth account 48"}}}
                  else .
                  end
                )
              ' /tmp/n8n-payload.json > /tmp/n8n-payload-bound.json
              mv /tmp/n8n-payload-bound.json /tmp/n8n-payload.json
              echo "Cloudflare Header Auth credential bound."
            else
              echo "Cloudflare Header Auth credential was not found; deploy continues without changing credential binding."
            fi
          else
            echo "Credential metadata API unavailable with this API key (HTTP $HTTP_CODE); deploy continues safely."
          fi

      - name: Deploy to n8n
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: 'https://vmi3001071.contaboserver.net'
          WORKFLOW_ID: ${{ github.event_name == 'push' && 'jwG2V2csZqHzAOTk' || inputs.workflow_id }}
        run: |
          set -euo pipefail
          test -n "$N8N_API_KEY"

          if [ -n "$WORKFLOW_ID" ]; then
            METHOD=PUT
            URL="$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID"
          else
            METHOD=POST
            URL="$N8N_BASE_URL/api/v1/workflows"
          fi

          HTTP_CODE=$(curl --silent --show-error             --output /tmp/n8n-response.json             --write-out '%{http_code}'             --request "$METHOD"             --url "$URL"             --header "X-N8N-API-KEY: $N8N_API_KEY"             --header 'Content-Type: application/json'             --data-binary @/tmp/n8n-payload.json)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            jq '{message,code}' /tmp/n8n-response.json || cat /tmp/n8n-response.json
            echo "n8n deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi

          jq '{id,name,active,updatedAt}' /tmp/n8n-response.json
          echo "n8n deployment completed with HTTP $HTTP_CODE"


      - name: Set staging workflow activation state
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: 'https://vmi3001071.contaboserver.net'
          WORKFLOW_ID: ${{ github.event_name == 'push' && 'jwG2V2csZqHzAOTk' || inputs.workflow_id }}
          WORKFLOW_PATH: ${{ github.event_name == 'push' && 'automation/n8n/workflows/linkedin-image-generator-v3-cloudflare-staging.json' || inputs.workflow_path }}
        run: |
          set -euo pipefail
          test -n "$N8N_API_KEY"
          test -n "$WORKFLOW_ID"

          if jq -e '.meta.stagingWebhookTest == true' "$WORKFLOW_PATH" >/dev/null; then
            ACTION=activate
          else
            ACTION=deactivate
          fi

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/n8n-activation.json \
            --write-out '%{http_code}' \
            --request POST \
            --url "$N8N_BASE_URL/api/v1/workflows/$WORKFLOW_ID/$ACTION" \
            --header "X-N8N-API-KEY: $N8N_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            jq '{message,code}' /tmp/n8n-activation.json || cat /tmp/n8n-activation.json
            echo "n8n workflow $ACTION failed with HTTP $HTTP_CODE"
            exit 1
          fi

          jq '{id,name,active,updatedAt}' /tmp/n8n-activation.json
          echo "n8n workflow $ACTION completed with HTTP $HTTP_CODE"
