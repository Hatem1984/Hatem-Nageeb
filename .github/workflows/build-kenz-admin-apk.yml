name: Build KENZ Admin APK

on:
  push:
    branches:
      - kenz-admin-apk
    paths:
      - 'android/kenz-admin/**'
      - '.github/workflows/build-kenz-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed internal release
        working-directory: android/kenz-admin
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          APK="android/kenz-admin/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "KENZ-Admin-v1.0.0.apk"
          sha256sum "KENZ-Admin-v1.0.0.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KENZ-Admin-v1.0.0
          path: KENZ-Admin-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
