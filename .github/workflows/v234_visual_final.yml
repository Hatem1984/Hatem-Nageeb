name: V23.4 final visual conversion polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v234_visual_final.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply final landing-page visual system
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Force the corrected academy logo and bust old browser cache.
          s = s.replace('tbt_academy_logo_v23.svg?v=final-234', 'tbt_academy_logo_v23.svg')
          s = s.replace('tbt_academy_logo_v23.svg', 'tbt_academy_logo_v23.svg?v=final-234')

          # Add academy logo inside the certificate credibility block.
          old_cert = '''<div class="certificate-box">
          <b>بالشراكة مع أكاديمية المدرب الأفضل:</b><br/>
          يحصل من يستوفي متطلبات الحضور والتطبيق والمشروع النهائي على <b>شهادة إتمام صادرة باسم أكاديمية المدرب الأفضل ولعبة البزنس</b>.
          
        </div>'''
          new_cert = '''<div class="certificate-box certificate-box-final">
          <div class="certificate-partner-mark"><img src="tbt_academy_logo_v23.svg?v=final-234" alt="أكاديمية المدرب الأفضل"/><div><b>بالشراكة مع أكاديمية المدرب الأفضل</b><span>جهة إصدار شهادة الإتمام بالشراكة مع لعبة البزنس</span></div></div>
          يحصل من يستوفي متطلبات الحضور والتطبيق والمشروع النهائي على <b>شهادة إتمام صادرة باسم أكاديمية المدرب الأفضل ولعبة البزنس</b>.
        </div>'''
          if old_cert in s:
              s = s.replace(old_cert, new_cert, 1)

          grid_start = '    <div class="bundle-grid" style="margin-top:22px">'
          ai_start = '    <div class="ai-box">'
          if grid_start not in s or ai_start not in s:
              raise SystemExit('Bundle markers not found')

          gs = s.index(grid_start)
          ae = s.index(ai_start, gs)

          new_grid = '''    <div class="bundle-grid premium-bundle-grid" style="margin-top:22px">
      <div class="bundle visual-card reveal zoom-card">
        <div class="visual-media zoom-scene"><div class="zoom-window"><div class="zoom-cam"><svg viewBox="0 0 48 48"><rect x="7" y="12" width="24" height="24" rx="6"/><path d="M31 20l10-6v20l-10-6z"/></svg></div><div class="live-dot"></div><span>LIVE</span></div><div class="zoom-pulse z1"></div><div class="zoom-pulse z2"></div></div>
        <div class="visual-copy"><div class="bundle-no">01</div><h3>25 لقاء مباشرًا</h3><p>جلسة تعريفية إضافية + 24 جلسة تدريبية فعلية على Zoom.</p></div>
      </div>

      <div class="bundle visual-card reveal tools-card">
        <div class="visual-media tools-scene"><div class="tool-sheet"><i></i><i></i><i></i></div><div class="tool-chart"><span style="height:34%"></span><span style="height:55%"></span><span style="height:76%"></span><span style="height:100%"></span></div><div class="tool-check">✓</div></div>
        <div class="visual-copy"><div class="bundle-no">02</div><h3>Workbook + 24 أداة</h3><p>نماذج وأدوات تطبيقية تتجمع تدريجيًا في ملف القرار النهائي.</p></div>
      </div>

      <div class="bundle visual-card reveal whatsapp-card">
        <div class="visual-media whatsapp-scene"><div class="whatsapp-badge"><svg viewBox="0 0 48 48"><path d="M24 7a16 16 0 0 0-13.8 24L8 40l9.2-2.1A16 16 0 1 0 24 7z"/><path d="M18 17c1 7 6 12 13 13l3-4-5-2-2 2c-3-1-5-3-6-6l2-2-2-5z"/></svg></div><div class="chat-bubble cb1"></div><div class="chat-bubble cb2"></div></div>
        <div class="visual-copy"><div class="bundle-no">03</div><h3>متابعة عبر WhatsApp</h3><p>جروب خاص للمتابعة وأسئلة التطبيق والتنبيهات بين الجلسات.</p></div>
      </div>

      <div class="bundle visual-card reveal telegram-card">
        <div class="visual-media telegram-scene"><div class="telegram-badge"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M15 31.5 49 18 42.5 47 31 38.5 24.5 44 26.5 35.5z"/></svg></div><div class="telegram-lines"><span></span><span></span><span></span></div></div>
        <div class="visual-copy"><div class="bundle-no">04</div><h3>تسجيلات على Telegram لمدة 6 أشهر</h3><p>ترجع للجلسات المسجلة من بداية الدفعة طوال فترة الإتاحة.</p></div>
      </div>

      <div class="bundle visual-card reveal decision-card-visual">
        <div class="visual-media decision-scene"><div class="decision-folder"><b>قرار</b><span></span><span></span></div><div class="roadmap"><i>30</i><i>60</i><i>90</i><em></em></div></div>
        <div class="visual-copy"><div class="bundle-no">05</div><h3>ملف قرار + خطة 90 يومًا</h3><p>المخرج النهائي: قرار موثق، أولويات تنفيذ ومؤشرات مراجعة للـ90 يوم التالية.</p></div>
      </div>

      <div class="bundle visual-card reveal certificate-card">
        <div class="visual-media certificate-scene"><div class="certificate-paper"><img src="tbt_academy_logo_v23.svg?v=final-234" alt="أكاديمية المدرب الأفضل"/><span></span><span></span><div class="seal">✓</div></div></div>
        <div class="visual-copy"><div class="bundle-no">06</div><h3>شهادة إتمام</h3><p>باسم أكاديمية المدرب الأفضل ولعبة البزنس بعد استيفاء متطلبات الإتمام.</p></div>
      </div>

      <div class="bundle visual-card reveal book-card">
        <div class="visual-media image-scene book-scene"><img src="book_khoroog_men_elnfaq.webp" alt="كتاب الخروج من النفق" loading="lazy"/></div>
        <div class="visual-copy"><div class="bundle-no">07</div><h3>كتاب «الخروج من النفق»</h3><p>نسخة رقمية هدية بعد انتهاء نافذة الاسترداد.</p></div>
      </div>

      <div class="bundle visual-card reveal print-card">
        <div class="visual-media print-scene"><div class="mini-book"><img src="book_khoroog_men_elnfaq.webp" alt="نسخة مطبوعة من كتاب الخروج من النفق" loading="lazy"/></div><div class="print-package"><svg viewBox="0 0 64 64"><path d="M12 20h40v32H12zM20 20V12h24v8M18 38h28M22 32h20"/></svg><b>PRINT</b></div></div>
        <div class="visual-copy"><div class="bundle-no">08</div><h3>نسخة مطبوعة اختيارية</h3><p>250 جنيه + تكلفة الشحن حسب المنطقة عند الطلب.</p></div>
      </div>

      <div class="bundle visual-card reveal ai-card-mini">
        <div class="visual-media ai-mini-scene"><div class="ai-mini-head"><span>AI</span><b>التشخيص قبل الحل</b></div><div class="ai-mini-dashboard"><div class="mini-bars"><i></i><i></i><i></i><i></i></div><div class="mini-donut"></div><div class="mini-checks"><i>✓</i><i>✓</i><i>✓</i></div></div></div>
        <div class="visual-copy"><div class="bundle-no">09</div><h3>أداة التشخيص بالذكاء الاصطناعي</h3><p>6 أشهر استخدام مجاني للدفعة الأولى، تبدأ من تاريخ تفعيل حسابك على الأداة.</p></div>
      </div>
    </div>

'''
          s = s[:gs] + new_grid + s[ae:]

          ai_start_pos = s.index(ai_start, gs)
          offer_marker = '\n  </div>\n</section>\n\n<section class="section offer"'
          ai_end_pos = s.index(offer_marker, ai_start_pos)
          new_ai = '''    <div class="ai-showcase-final reveal">
      <div class="ai-product-visual" aria-label="تصور لواجهة أداة AI التشخيص قبل الحل">
        <div class="ai-product-top"><span>AI</span><div><b>التشخيص قبل الحل</b><small>تصور للواجهة — الأداة قيد التطوير</small></div></div>
        <div class="ai-product-grid">
          <div class="ai-panel"><b>مؤشرات المشروع</b><div class="smart-bars"><i style="height:32%"></i><i style="height:48%"></i><i style="height:64%"></i><i style="height:83%"></i></div></div>
          <div class="ai-panel"><b>أولوية التشخيص</b><div class="smart-ring"><span>72%</span></div></div>
          <div class="ai-panel wide"><b>قبل القرار</b><div class="diagnosis-list"><span><i></i>حقائق متاحة</span><span><i></i>افتراضات تحتاج اختبار</span><span><i></i>معلومات ناقصة قبل الحكم</span></div></div>
        </div>
      </div>
      <div class="ai-product-copy">
        <span class="ai-label">ميزة للدفعة الأولى</span>
        <h3>AI التشخيص قبل الحل</h3>
        <p>تصور مبدئي لأداة تساعدك على تنظيم أسئلة التشخيص وقراءة المؤشرات وتسريع التحليل بعد ما تتعلم المنهج وتفهم بيانات مشروعك.</p>
        <div class="ai-access-note"><b>6 أشهر استخدام مجاني</b><span>تبدأ من تاريخ تفعيل حسابك على الأداة.</span></div>
      </div>
    </div>
'''
          s = s[:ai_start_pos] + new_ai + s[ai_end_pos:]

          css_marker = '/* V23.4 final visual system */'
          if css_marker not in s:
              css = r'''

/* V23.4 final visual system */
