.ai-product-top{display:flex;align-items:center;gap:10px;padding-bottom:13px;border-bottom:1px solid #dde8e4}.ai-product-top>span{width:42px;height:42px;border-radius:13px;background:#0e3a32;color:#ffd782;display:grid;place-items:center;font-weight:900}.ai-product-top b{display:block;color:#0e3a32;font-size:16px}.ai-product-top small{display:block;color:#6b7a74;font-size:10.5px;font-weight:600;margin-top:2px}
.ai-product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.ai-panel{background:#fff;border:1px solid #dfe9e5;border-radius:14px;padding:12px}.ai-panel>b{display:block;color:#24463e;font-size:11px;margin-bottom:8px}.ai-panel.wide{grid-column:1/-1}.smart-bars{height:76px;display:flex;align-items:end;gap:7px}.smart-bars i{flex:1;background:linear-gradient(#1f7966,#0e4f42);border-radius:6px 6px 2px 2px;animation:barRise 3s ease-in-out infinite alternate}.smart-ring{width:78px;height:78px;border-radius:50%;margin:auto;background:conic-gradient(#e6a63d 0 72%,#edf2ef 72%);display:grid;place-items:center;position:relative}.smart-ring:before{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%}.smart-ring span{position:relative;z-index:2;font-weight:900;color:#0e3a32}.diagnosis-list{display:grid;gap:7px}.diagnosis-list span{font-size:11px;color:#53645d;font-weight:600;display:flex;align-items:center;gap:7px}.diagnosis-list i{width:7px;height:7px;border-radius:50%;background:#e6a63d}
.ai-product-copy{align-self:center;position:relative;z-index:1}.ai-product-copy h3{color:#fff;font-size:28px;margin:10px 0}.ai-product-copy p{color:#d7e7e1;font-size:14.5px;line-height:1.9;font-weight:500}.ai-access-note{margin-top:15px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}.ai-access-note b{display:block;color:#ffd782}.ai-access-note span{display:block;color:#d8e8e2;font-size:12px;font-weight:600}

@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(225,72,72,.35)}50%{box-shadow:0 0 0 8px rgba(225,72,72,0)}}
@keyframes softPulse{0%,100%{transform:scale(.92);opacity:.45}50%{transform:scale(1.05);opacity:.9}}
@keyframes barRise{0%{transform:scaleY(.88);transform-origin:bottom}100%{transform:scaleY(1);transform-origin:bottom}}
@keyframes chatFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes planeFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes roadMove{0%{right:19px;width:30px}50%{right:53px;width:50px}100%{right:88px;width:30px}}
@keyframes sealGlow{0%,100%{box-shadow:0 7px 15px rgba(213,148,31,.22)}50%{box-shadow:0 7px 25px rgba(213,148,31,.45)}}

@media(max-width:920px){.premium-bundle-grid{grid-template-columns:repeat(2,1fr)}.ai-showcase-final{grid-template-columns:1fr}}
@media(max-width:640px){.premium-bundle-grid{grid-template-columns:1fr}.visual-card{min-height:0}.visual-media{height:170px}.ai-showcase-final{padding:17px}.ai-product-copy h3{font-size:24px}.certificate-partner-mark{grid-template-columns:72px 1fr}.certificate-partner-mark img{width:68px;height:56px}}
@media(prefers-reduced-motion:reduce){.live-dot,.zoom-pulse,.tool-chart span,.chat-bubble,.telegram-badge,.roadmap em,.seal,.smart-bars i{animation:none!important}}
