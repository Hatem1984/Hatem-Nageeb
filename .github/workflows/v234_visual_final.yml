      - name: Commit landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build final premium visual system for V23.4"
          git push

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/v234_visual_final.yml
          git add -A
          git diff --cached --quiet || git commit -m "Remove one-time V23.4 visual workflow"
          git push
