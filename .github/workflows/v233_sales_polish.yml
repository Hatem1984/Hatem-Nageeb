.ai-preview{min-height:245px;border-radius:17px;background:linear-gradient(145deg,#f8fffc,#eef7f3);border:1px solid #d6e7df;padding:17px;color:#163a31;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
