name: V23.3 sales psychology and visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v233_sales_polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply tested V23.3 patch
        run: python .github/scripts/v233_patch.py

      - name: Commit V23.3
        run: |
          git config user.name "Hatem1984"
          git config user.email "88743642+Hatem1984@users.noreply.github.com"
          git add index.html
          git commit -m "Release V23.3 conversion and visual polish"
          git rm .github/workflows/v233_sales_polish.yml
          git rm .github/scripts/v233_patch.py
          git commit -m "Remove one-time V23.3 patch files"
          git push origin main
