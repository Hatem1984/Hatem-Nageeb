name: V23.3 sales psychology and visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v233_sales_polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply V23.3 conversion and visual refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # --- Top countdown: real deadline only (cohort start) ---
          s = re.sub(
            r'<div class="top-note">\s*<div class="wrap">.*?</div>\s*</div>',
            '''<div class="top-note">
  <div class="wrap launch-bar">
    <div class="launch-copy"><b>دفعة أكتوبر تبدأ الخميس 1 أكتوبر 2026</b><span>7:30 مساءً بتوقيت مصر</span></div>
    <div class="countdown" aria-label="الوقت المتبقي لبدء الدفعة">
      <div><b id="cd-days">--</b><span>يوم</span></div>
      <div><b id="cd-hours">--</b><span>ساعة</span></div>
      <div><b id="cd-mins">--</b><span>دقيقة</span></div>
      <div><b id="cd-secs">--</b><span>ثانية</span></div>
    </div>
  </div>
</div>''', s, count=1, flags=re.S)

          # --- Academy logo: use corrected transparent asset with visible graduation cap ---
          s = s.replace('src="tbt_academy_logo_clean.png"', 'src="tbt_academy_logo_v23.svg"')
          s = s.replace('src="tbt_academy_logo.svg"', 'src="tbt_academy_logo_v23.svg"')

          # --- Hero CTA and wording ---
          s = s.replace('برنامج Live تطبيقي لأصحاب المشروعات', 'برنامج تطبيقي مباشر لأصحاب المشروعات')
          s = s.replace('>شوف السعر وخطة السداد</a>', '>احجز مكانك بـ2,000 جنيه</a>', 2)
          s = s.replace('>اسأل هل البرنامج مناسب لمشروعك</a>', '>عندك سؤال؟ تواصل معنا</a>')
          s = s.replace('>عندي سؤال قبل الحجز</a>', '>عندك سؤال؟ تواصل معنا</a>')

          # --- Profile chips: remove "author" from the identity chips ---
          s = s.replace('<span>MBA</span><span>مؤلف كتاب</span><span>تأهيل مدربين 48 ساعة</span>',
                        '<span>MBA</span><span>خبرة إدارية وتشغيلية</span><span>تأهيل مدربين 48 ساعة</span>')

          # --- Credential logos: visual only; no outbound links ---
          s = re.sub(
            r'<div class="authority-point credential-point"><a class="credential-logo-wrap" href="https://www\.eb\.university/".*?</a><div class="credential-copy"><b>ماجستير إدارة أعمال \(MBA\)</b><span>(.*?)</span></div></div>',
            r'''<div class="authority-point credential-point"><div class="credential-logo-wrap ebu-wrap" aria-label="Entrepreneurship & Business University"><img class="credential-logo ebu-mark" src="https://www.eb.university/images/logo.svg" alt="Entrepreneurship & Business University (EBU)" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="credential-fallback">EBU</span></div><div class="credential-copy"><b>ماجستير إدارة أعمال (MBA)</b><span>\1</span></div></div>''',
            s, count=1, flags=re.S)

          s = re.sub(
            r'<div class="authority-point credential-point"><a class="credential-logo-wrap" href="https://www\.london\.edu/.*?</a><div class="credential-copy"><b>إدارة شركات المستقبل</b><span>(.*?)</span></div></div>',
            r'''<div class="authority-point credential-point"><div class="credential-logo-wrap lbs-wrap" aria-label="London Business School"><img class="credential-logo lbs-mark" src="https://upload.wikimedia.org/wikipedia/commons/b/bc/London_Business_School_logo.svg" alt="London Business School" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="credential-fallback lbs-fallback">LBS</span></div><div class="credential-copy"><b>إدارة شركات المستقبل</b><span>\1</span></div></div>''',
            s, count=1, flags=re.S)

          # --- Full value stack: four visual animated cards with small SVG illustrations ---
          s = s.replace('<div class="bundle"><div class="bundle-no">01</div><h3>25 لقاء Live</h3><p class="micro">Orientation إضافية + 24 جلسة تدريبية فعلية.</p></div>',
          '''<div class="bundle reveal featured-bundle"><div class="bundle-icon zoom-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="7" y="12" width="24" height="24" rx="6"/><path d="M31 20l10-6v20l-10-6z"/></svg></div><div class="bundle-no">01</div><h3>25 لقاء مباشرًا</h3><p class="micro">جلسة تعريفية إضافية + 24 جلسة تدريبية فعلية على Zoom.</p></div>''')
          s = s.replace('<div class="bundle"><div class="bundle-no">02</div><h3>Workbook تطبيقي + 24 أداة</h3><p class="micro">تطبيقات تتجمع في ملف القرار النهائي.</p></div>',
          '''<div class="bundle reveal featured-bundle"><div class="bundle-icon tools-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="11" y="8" width="26" height="32" rx="5"/><path d="M18 8v-2h12v2M17 18h14M17 25h14M17 32h9"/></svg></div><div class="bundle-no">02</div><h3>Workbook + 24 أداة</h3><p class="micro">نماذج وأدوات تطبيقية تتجمع في ملف القرار النهائي.</p></div>''')
          s = s.replace('<div class="bundle"><div class="bundle-no">02</div><h3>Workbook + 24 أداة</h3><p class="micro">تطبيقات تتجمع في ملف القرار النهائي.</p></div>',
          '''<div class="bundle reveal featured-bundle"><div class="bundle-icon tools-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="11" y="8" width="26" height="32" rx="5"/><path d="M18 8v-2h12v2M17 18h14M17 25h14M17 32h9"/></svg></div><div class="bundle-no">02</div><h3>Workbook + 24 أداة</h3><p class="micro">نماذج وأدوات تطبيقية تتجمع في ملف القرار النهائي.</p></div>''')
          s = s.replace('<div class="bundle"><div class="bundle-no">03</div><h3>WhatsApp</h3><p class="micro">متابعة جماعية بين الجلسات.</p></div>',
          '''<div class="bundle reveal featured-bundle"><div class="bundle-icon whatsapp-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 7a16 16 0 0 0-13.8 24L8 40l9.2-2.1A16 16 0 1 0 24 7z"/><path d="M18 17c1 7 6 12 13 13l3-4-5-2-2 2c-3-1-5-3-6-6l2-2-2-5z"/></svg></div><div class="bundle-no">03</div><h3>متابعة عبر WhatsApp</h3><p class="micro">جروب خاص للمتابعة وأسئلة التطبيق والتنبيهات بين الجلسات.</p></div>''')
          s = s.replace('<div class="bundle"><div class="bundle-no">06</div><h3>شهادة إتمام</h3><p class="micro">باسم أكاديمية المدرب الأفضل ولعبة البزنس بعد استيفاء المتطلبات.</p></div>',
          '''<div class="bundle reveal featured-bundle"><div class="bundle-icon certificate-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="25" rx="4"/><path d="M15 16h18M15 22h13"/><circle cx="31" cy="31" r="6"/><path d="M28 36l-2 7 5-3 5 3-2-7"/></svg></div><div class="bundle-no">06</div><h3>شهادة إتمام</h3><p class="micro">باسم أكاديمية المدرب الأفضل ولعبة البزنس بعد استيفاء المتطلبات.</p></div>''')
          s = s.replace('<div class="bundle">', '<div class="bundle reveal">')

          # --- AI preview: remove image copy inconsistency; show a clean interface mockup instead ---
          s = re.sub(
            r'<div class="ai-box">\s*<img src="ai_diagnostic_tool\.webp".*?/>\s*<div>',
            '''<div class="ai-box">
      <div class="ai-preview" aria-label="تصور مبسط لواجهة أداة التشخيص">
        <div class="ai-preview-head"><span>AI</span><b>التشخيص قبل الحل</b></div>
        <div class="ai-preview-row"><i></i><div><b>بيانات المشروع</b><span>مدخلاتك أولًا</span></div></div>
        <div class="ai-preview-row"><i></i><div><b>مؤشرات التشخيص</b><span>حقائق • احتمالات • معلومات ناقصة</span></div></div>
        <div class="ai-preview-row"><i></i><div><b>أولوية القرار</b><span>ما الذي يحتاج اختبارًا قبل التنفيذ؟</span></div></div>
      </div>
      <div>''', s, count=1, flags=re.S)
          s = s.replace('ميزة خاصة بالدفعة الأولى:</b> 6 أشهر استخدام مجاني عند تفعيل الأداة.',
                        'ميزة خاصة بالدفعة الأولى:</b> 6 أشهر استخدام مجاني تبدأ من تاريخ تفعيل حسابك على الأداة.')

          # --- Psychological price framing: honest anchor + launch offer + low entry barrier ---
          s = s.replace('<h2>4,500 جنيه للسداد الكامل، أو 5,000 جنيه بالتقسيط.</h2>\n    <p class="lead">السعر المعلن خاص بالدفعة الأولى. اختر السداد الكامل أو خطة التقسيط حسب الأنسب لك.</p>',
          '''<h2>عرض إطلاق الدفعة الأولى: 4,500 جنيه بدل 9,000 جنيه.</h2>
    <p class="lead">خصم إطلاق 50% على السعر القياسي للبرنامج. ولو مش مناسب تدفع كامل الآن، تقدر تحجز مكانك بـ2,000 جنيه فقط.</p>
    <div class="offer-trust-strip"><span>خصم إطلاق 50%</span><span>وفر 4,500 جنيه</span><span>احجز بـ2,000 جنيه</span><span>سياسة استرداد واضحة</span></div>''')

          # Fallback if line breaks differ
          s = s.replace('<h2>4,500 جنيه للسداد الكامل، أو 5,000 جنيه بالتقسيط.</h2>',
                        '<h2>عرض إطلاق الدفعة الأولى: 4,500 جنيه بدل 9,000 جنيه.</h2>')
          s = s.replace('<p class="lead">السعر المعلن خاص بالدفعة الأولى. اختر السداد الكامل أو خطة التقسيط حسب الأنسب لك.</p>',
                        '<p class="lead">خصم إطلاق 50% على السعر القياسي للبرنامج. ولو مش مناسب تدفع كامل الآن، تقدر تحجز مكانك بـ2,000 جنيه فقط.</p><div class="offer-trust-strip"><span>خصم إطلاق 50%</span><span>وفر 4,500 جنيه</span><span>احجز بـ2,000 جنيه</span><span>سياسة استرداد واضحة</span></div>')

          s = s.replace('<span class="price-tag">أفضل قيمة</span>\n        <h3>السداد الكامل</h3>\n        <div class="price">4,500 <small>جنيه</small></div>',
          '''<span class="price-tag">عرض إطلاق الدفعة الأولى</span>
        <h3>السداد الكامل</h3>
        <div class="standard-price">السعر القياسي <del>9,000 جنيه</del></div>
        <div class="launch-saving">خصم 50% • وفر 4,500 جنيه</div>
        <div class="price">4,500 <small>جنيه</small></div>''')
          s = s.replace('<a class="cta" href="#payment-options" data-track-pricing>اختار السداد الكامل</a>',
                        '<a class="cta" href="#payment-options" data-track-pricing>احجز الآن بـ2,000 أو ادفع 4,500</a>')
          s = s.replace('<div class="founding"><b style="color:#FFD782">مرونة في السداد:</b> تقدر تبدأ بحجز 2,000 جنيه، ولو أكملت باقي السداد قبل أول جلسة تدريب فعلية يظل إجمالي اشتراكك 4,500 جنيه.</div>',
                        '<div class="founding"><b style="color:#FFD782">ابدأ بأقل التزام نقدي:</b> احجز مكانك بـ2,000 جنيه، ولو أكملت 2,500 قبل أول جلسة تدريب فعلية يظل إجمالي اشتراكك 4,500 جنيه. ولو اخترت التقسيط الممتد يكون الإجمالي 5,000 جنيه.</div><div class="value-math">4,500 جنيه ÷ 25 لقاء مباشرًا = <b>180 جنيه تقريبًا للقاء</b>، قبل احتساب الأدوات والمتابعة والتسجيلات وباقي المزايا.</div>')

          # --- What happens after payment ---
          marker = '<div class="payment-proof">'
          after = '''<div class="after-payment">
        <b>بعد التحويل مباشرة:</b>
        <ol><li>اكتب اسمك بالكامل.</li><li>أرسل رقم الهاتف المستخدم للتواصل.</li><li>أرسل لقطة شاشة أو صورة إثبات التحويل على Messenger.</li></ol>
      </div>\n\n      '''
          if 'class="after-payment"' not in s:
              s = s.replace(marker, after + marker, 1)

          # --- Final CTA wording ---
          s = s.replace('>شوف طرق الدفع</a>', '>احجز مكانك الآن</a>', 1)

          # --- V23.3 CSS ---
          css = r'''
/* V23.3 psychological selling + visual system */
.launch-bar{display:flex!important;justify-content:space-between!important;gap:18px!important;padding:8px 0;min-height:62px!important}
