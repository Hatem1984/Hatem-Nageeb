name: KENZ G4.35 Direct Download Portal UX QA (synthetic only)
on:
  push:
    branches:
      - qa/kenz-xpay-g426-20261018
    paths:
      - 'kenz/portal/g435-qa/**'
      - '.github/workflows/kenz-g435-portal-ux-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guest-library-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static portal syntax
        run: node --check kenz/portal/g435-qa/portal-fixed.v129.js
      - name: Synthetic-only portal recovery and retries
        run: node --test kenz/portal/g435-qa/portal.test.mjs
