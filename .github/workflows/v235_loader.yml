name: Load V23.5 assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v235_loader.yml'

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire V23.5 assets into landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'v235.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="v235.css?v=1"/>\n</head>')
          if 'v235.js' not in s:
              s=s.replace('</body>','<script src="v235.js?v=1" defer></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load V23.5 final conversion assets'
          git push origin main
