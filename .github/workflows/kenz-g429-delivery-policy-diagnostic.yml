name: KENZ G4.29 Delivery Policy Diagnostic (synthetic only)
on:
  push:
    branches:
      - qa/kenz-xpay-g426-20261018
    paths:
      - 'kenz/payment/g429-qa/**'
      - '.github/workflows/kenz-g429-delivery-policy-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-db-policy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kenz_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Report current candidate consent and site-only gaps (NOT RELEASE PASS)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: kenz_qa
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f kenz/payment/g427-qa/01_schema_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f kenz/payment/g427-qa/kenz_g427_atomic_xpay_candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f kenz/payment/g429-qa/03_delivery_policy_diagnostic.sql
          psql -X -v ON_ERROR_STOP=1 -f kenz/payment/g429-qa/04_paid_portal_access_diagnostic.sql
