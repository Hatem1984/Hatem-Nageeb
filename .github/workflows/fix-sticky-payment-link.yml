name: Fix sticky payment link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sticky-payment-link.yml'

permissions:
  contents: write

jobs:
  update-sticky-cta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point fixed CTA to payment section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="cta booking-link" href="https://m.me/891183134080763" rel="noopener" target="_blank">احجز الآن</a>'
          new = '<a class="cta" href="#payment-options">احجز الآن</a>'
          if old not in s:
              raise SystemExit('Fixed CTA marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-sticky-payment-link.yml
          git add -A
          git commit -m "Point fixed booking CTA to payment options"
          git push origin main
