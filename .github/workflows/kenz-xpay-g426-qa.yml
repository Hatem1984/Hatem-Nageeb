name: KENZ G4.26 XPay QA (offline only)

on:
  push:
    branches:
      - qa/kenz-xpay-g426-20261018
    paths:
      - 'kenz/payment/g426-qa/**'
      - '.github/workflows/kenz-xpay-g426-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated QA branch
        uses: actions/checkout@v4
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check offline patch builder
        run: node --check kenz/payment/g426-qa/build-candidate.mjs
      - name: Offline fail-closed regression checks (no secret, no network, no payment)
        run: node --test kenz/payment/g426-qa/*.test.mjs
