name: Add payment options

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-payment-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply payment options patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/add_payment.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("script_marker = 'document.querySelectorAll(\".booking-link\").forEach(function(link){\\n  link.addEventListener(\"click\",trackBookingClick,{passive:true});\\n});'", "script_marker = '  document.querySelectorAll(\".booking-link\").forEach(function(link){\\n    link.addEventListener(\"click\",trackBookingClick,{passive:true});\\n  });'")
          p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/add_payment.py
      - name: Commit landing page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Vodafone Cash and InstaPay payment options" || true
          git rm -f .github/workflows/add-payment-options.yml scripts/add_payment.py
          git commit -m "Remove one-time payment updater"
          git push origin main
