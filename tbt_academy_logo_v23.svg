<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 210" role="img" aria-labelledby="title desc">
  <title id="title">The Best Trainer</title>
  <desc id="desc">شعار أكاديمية المدرب الأفضل بخلفية شفافة وكاب تخرج ظاهر</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C64E"/>
      <stop offset="0.45" stop-color="#D99A16"/>
      <stop offset="1" stop-color="#A96600"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242A"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- graduation cap -->
  <g filter="url(#soft)">
    <polygon points="56,43 132,12 205,39 132,70" fill="url(#cap)" stroke="#333A42" stroke-width="1.5"/>
    <path d="M87 55 C99 72, 165 72, 180 53 L178 69 C160 84, 108 84, 88 69 Z" fill="#11151A"/>
    <path d="M188 39 C198 48, 199 60, 194 72" fill="none" stroke="#E4A719" stroke-width="3" stroke-linecap="round"/>
    <circle cx="194" cy="74" r="4.5" fill="#E4A719"/>
  </g>

  <!-- academy mark / shield -->
  <g filter="url(#soft)">
    <path d="M70 77 L103 60 L136 74 L168 60 L201 77 L196 130 L136 158 L75 130 Z" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M78 84 L103 72 L136 85 L168 72 L193 84" fill="none" stroke="#E7B02E" stroke-width="4" stroke-linecap="round"/>
    <text x="136" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-5" fill="url(#gold)">TBT</text>
  </g>

  <!-- brand name -->
  <text x="135" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#D99A16">The Best Trainer</text>
  <text x="135" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.6" fill="#27312D">Together to build a better future</text>
</svg>